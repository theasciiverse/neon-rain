[package]
name = "neon-rain"
version = "1.0.0"
edition = "2021"
description = "A rainy neon street at night, seen from above, in the terminal"
license = "MIT"

[dependencies]
crossterm = "0.29"
fastrand = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
